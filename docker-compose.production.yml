services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    hostname: omnicloud-api
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 8787
      APP_MODE: hosted
      DATABASE_PATH: /app/data/omnicloud.db
      CORS_ORIGIN: https://cloud.safme.id
      FRONTEND_URL: https://cloud.safme.id
      GOOGLE_REDIRECT_URI: https://cloud.safme.id/api/accounts/google/callback
      ONEDRIVE_REDIRECT_URI: https://cloud.safme.id/api/accounts/onedrive/callback
      DROPBOX_REDIRECT_URI: https://cloud.safme.id/api/accounts/dropbox/callback
      YANDEX_REDIRECT_URI: https://cloud.safme.id/api/accounts/yandex/callback
    volumes:
      - omnicloud_api_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: /ws/uploads
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  omnicloud_api_data:
